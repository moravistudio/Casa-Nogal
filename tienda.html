<body data-page="tienda">

<main id="contenido">

  <section class="wrap cabecera-pagina" aria-labelledby="titulo-pagina">
    <p class="migas"><a href="index.html">Inicio</a> &nbsp;/&nbsp; <span aria-current="page">Tienda</span></p>
    <div class="cabecera-pagina__marco">
      <p class="script">Para cada rincón de tu hogar</p>
      <h1 id="titulo-pagina">Tienda</h1>
    </div>
  </section>

  <div class="wrap tienda">
    <aside class="filtros" aria-label="Filtros">
      <div>
        <h2 class="filtros__titulo">Categorías</h2>
        <div class="filtros__cats" id="filtro-categorias"></div>
      </div>
      <div class="filtros__selects">
        <div class="campo">
          <label for="filtro-ambiente">Ambiente</label>
          <select id="filtro-ambiente"><option value="">Todos</option></select>
        </div>
        <div class="campo">
          <label for="filtro-precio">Rango de precio</label>
          <select id="filtro-precio"><option value="">Todos</option></select>
        </div>
        <div class="campo filtros__orden">
          <label for="filtro-orden">Ordenar por</label>
          <select id="filtro-orden">
            <option value="">Destacados</option>
            <option value="menor">Menor precio</option>
            <option value="mayor">Mayor precio</option>
            <option value="novedades">Novedades</option>
          </select>
        </div>
      </div>
    </aside>

    <section aria-label="Productos" style="min-width: 0">
      <div class="tienda__resumen" aria-live="polite"><span id="resumen"></span><span>Precios en soles (S/)</span></div>
      <div class="grilla-productos" id="lista-productos"></div>
      <noscript><p>Para ver los productos activa JavaScript, o <a href="contacto.html">escríbenos</a> y te enviamos el catálogo.</p></noscript>
    </section>
  </div>

</main>

<div id="pie"></div>
